# Antares2 Workflow Release Version Bump And Tag

## Action

Follow the release-version-bump-and-tag workflow:
1. Bump version in package.json, src-tauri/Cargo.toml, src-tauri/Cargo.lock (antares2 entry), and src-tauri/tauri.conf.json.
2. Generate docs/release-notes-vX.Y.Z.md skeleton from git log.
3. Pause for author to fill in release notes prose.
4. Commit version bump and release notes.
5. Create annotated git tag vX.Y.Z.
6. Push dev branch and tag to origin.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: package.json, src-tauri/Cargo.toml, src-tauri/Cargo.lock

